<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Players | Fantasy Football</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="container">

        <!-- ================= Sidebar ================= -->

        <aside class="sidebar">

            <div class="logo">
                <img src="../assets/logo.png" alt="Logo">
            </div>

            <nav>

                <ul>

                    <li>
                        <a href="dashboard.html">
                            <i class="fa-solid fa-house"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>

                    <li class="active">
                        <a href="players.html">
                            <i class="fa-solid fa-user"></i>
                            <span>Players</span>
                        </a>
                    </li>

                    <li>
                        <a href="match-details.html">
                            <i class="fa-solid fa-calendar-days"></i>
                            <span>Match Details</span>
                        </a>
                    </li>

                    <li>
                        <a href="my-team.html">
                            <i class="fa-solid fa-shirt"></i>
                            <span>My Team</span>
                        </a>
                    </li>

                    <li>
                        <a href="transfers.html">
                            <i class="fa-solid fa-right-left"></i>
                            <span>Transfers</span>
                        </a>
                    </li>

                    <li>
                        <a href="leaderboard.html">
                            <i class="fa-solid fa-trophy"></i>
                            <span>Leaderboard</span>
                        </a>
                    </li>

                    <li>
                        <a href="leagues.html">
                            <i class="fa-solid fa-futbol"></i>
                            <span>Leagues</span>
                        </a>
                    </li>

                    <li>
                        <a href="statistics.html">
                            <i class="fa-solid fa-chart-simple"></i>
                            <span>Statistics</span>
                        </a>
                    </li>

                    <li>
                        <a href="live.html">
                            <i class="fa-solid fa-tv"></i>
                            <span>Live</span>
                        </a>
                    </li>

                    <li>
                        <a href="fixtures.html">
                            <i class="fa-solid fa-diagram-project"></i>
                            <span>Fixtures</span>
                        </a>
                    </li>

                </ul>

            </nav>

        </aside>

        <!-- ================= Main ================= -->

        <main class="main">

            <!-- Top Navigation -->

            <header class="topbar">

                <div>

                    <h1>Players</h1>

                    <p>Browse and select football players.</p>

                </div>

                <div class="profile">

                    <img src="../assets/images/profile.jpg" alt="Profile">

                    <div>

                        <h4>Prajwal</h4>

                        <small>Manager</small>

                    </div>

                </div>

            </header>

            <!-- Search Area -->

            <section class="search-box">

                <div class="search">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input type="text" id="searchPlayer" placeholder="Search player...">

                </div>

                <select id="positionFilter">

                    <option value="">Position</option>

                    <option>Goalkeeper</option>

                    <option>Defender</option>

                    <option>Midfielder</option>

                    <option>Forward</option>

                </select>

                <select id="clubFilter">

                    <option value="">Club</option>

                    <option>Manchester City</option>

                    <option>Liverpool</option>

                    <option>Arsenal</option>

                    <option>Chelsea</option>

                    <option>Manchester United</option>

                    <option>Real Madrid</option>

                </select>

                <select id="sortFilter">

                    <option value="">Sort</option>

                    <option value="points">
                        Highest Points
                    </option>

                    <option value="price">
                        Highest Price
                    </option>

                </select>

            </section>

            <!-- Player Grid -->

            <section class="player-grid" id="playerGrid">

                <!-- JavaScript will generate player cards -->

            </section>

        </main>

    </div>

    <script src="../js/players.js"></script>

</body>

</html>
