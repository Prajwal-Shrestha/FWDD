<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Points History — Fantasy Football</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/points_history.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="logo">
        <i class="fa-solid fa-futbol"></i>
        <h2>Fantasy Football</h2>
      </div>
      <nav>
        <ul>
          <li>
            <a href="dashboard.html">
              <i class="fa-solid fa-house"></i>
              Dashboard
            </a>
          </li>
          <li>
            <a href="players.html">
              <i class="fa-solid fa-user"></i>
              Players
            </a>
          </li>
          <li>
            <a href="matchdetail.html">
              <i class="fa-solid fa-calendar"></i>
              Match Details
            </a>
          </li>
          <li></li>
          <li>
            <a href="my-team.html">
              <i class="fa-solid fa-shirt"></i>
              My Team
            </a>
          </li>
          <li>
            <a href="transfer.html">
              <i class="fa-solid fa-right-left"></i>
              Transfer
            </a>
          </li>
          <li>
            <a href="#">
              <i class="fa-solid fa-trophy"></i>
              Leaderboard
            </a>
          </li>
          <li>
            <a href="#">
              <i class="fa-solid fa-futbol"></i>
              League
            </a>
          </li>
          <li>
            <a href="#">
              <i class="fa-solid fa-chart-column"></i>
              Statistics
            </a>
          </li>
          <li>
            <a href="live.html">
              <i class="fa-solid fa-tv"></i>
              Live
            </a>
          </li>
          <li class="active">
            <a href="fixtures.html">
              <i class="fa-solid fa-diagram-project"></i>
              Fixtures
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="main">
      <div class="chart-card">
        <div class="chart-head">
          <h1>Points History</h1>
          <div class="select-wrap">
            <button class="range-select" id="rangeSelectBtn">
              <span id="rangeLabel">This Year</span>
              <i class="fa-solid fa-chevron-down"></i>
            </button>
            <div class="range-dropdown" id="rangeDropdown">
              <button class="selected" data-range="thisYear">This Year</button>
              <button data-range="lastYear">Last Year</button>
              <button data-range="allTime">All Time</button>
            </div>
          </div>
        </div>
        <div class="chart-wrap" id="chartWrap">
          <div class="chart-tooltip" id="chartTooltip">
            <div class="pts">0 pts</div>
            <div class="gw">Gameweek 0</div>
          </div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-icon navy">
            <i class="fa-solid fa-layer-group"></i>
          </div>
          <div class="stat-text">
            <div class="label">Total Points</div>
            <div class="value" id="totalPointsValue">0</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">
            <i class="fa-solid fa-arrow-trend-up"></i>
          </div>
          <div class="stat-text">
            <div class="label">Average / Gameweek</div>
            <div class="value" id="avgPointsValue">0</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon gold"><i class="fa-solid fa-medal"></i></div>
          <div class="stat-text">
            <div class="label">Best Gameweek</div>
            <div class="value" id="bestGwValue">0</div>
            <div class="sub" id="bestGwSub">—</div>
          </div>
        </div>
      </div>

      <div class="history-card">
        <div class="history-head">
          <h2>Gameweek History</h2>
        </div>
        <div class="table-header">
          <div class="col-date">Date</div>
          <div class="col-desc">Description</div>
          <div class="col-points">Points</div>
        </div>
        <div id="historyBody"></div>
        <div class="load-more-wrap">
          <button class="load-more-btn" id="loadMoreBtn">Load more</button>
        </div>
      </div>
    </main>

    <script src="../js/points_history.js" />
  </body>
</html>
