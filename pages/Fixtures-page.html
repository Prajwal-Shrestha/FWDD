<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixtures — Fantasy Football</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="../css/fixtures.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
       
       
      </aside> 
      <main>
        <div class="topbar">
          <div>
            <span class="eyebrow">Matchweek Schedule</span>
            <h1>Fixtures</h1>
          </div>
        </div>

        <div class="search-wrap">
          <div class="search-box">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#98a5ab"
              stroke-width="2">
              <circle cx="11" cy="11" r="7" />
              <path d="M21 21l-4.3-4.3" />
            </svg>
            <input
              type="text"
              id="searchInput"
              placeholder='Search by team, e.g. "Team A"'
              aria-label="Search matches" />
          </div>
          <button class="search-btn" id="searchBtn" aria-label="Search">
            <svg
              width="19"
              height="19"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2">
              <circle cx="11" cy="11" r="7" />
              <path d="M21 21l-4.3-4.3" />
            </svg>
          </button>
        </div>

        <div class="section-bar pitch-texture">
          <h2>Upcoming Matches</h2>
          <span class="result-count" id="resultCount">5 matches</span>
        </div>

        <div class="match-panel">
          <div class="match-head-row">
            <span>Match</span>
            <span>Date</span>
            <span>Time</span>
          </div>
          <div id="matchList"></div>
          <div class="empty-state" id="emptyState">
            <strong>No fixtures found</strong>
            No matches for that search — try a different team name.
          </div>
        </div>
      </main>
    </div>

    <script>
      const matches = [
        {
          home: "Team A",
          away: "Team B",
          date: "20 May 2026",
          time: "4:00 pm",
        },
        {
          home: "Team C",
          away: "Team D",
          date: "20 May 2026",
          time: "5:00 pm",
        },
        {
          home: "Team E",
          away: "Team F",
          date: "21 May 2026",
          time: "4:00 pm",
        },
        {
          home: "Team G",
          away: "Team H",
          date: "21 May 2026",
          time: "6:00 pm",
        },
        {
          home: "Team I",
          away: "Team J",
          date: "22 May 2026",
          time: "5:00 pm",
        },
      ];

      const colorPairs = [
        ["#0f5c33", "#0c1b36"],
        ["#177a41", "#1a3260"],
        ["#22a05a", "#0c1b36"],
        ["#0f5c33", "#1a3260"],
        ["#177a41", "#081226"],
      ];

      function initials(name) {
        return name
          .split(" ")
          .map((w) => w[0])
          .join("")
          .toUpperCase();
      }

      function renderMatches(list) {
        const container = document.getElementById("matchList");
        const empty = document.getElementById("emptyState");
        const count = document.getElementById("resultCount");
        container.innerHTML = "";

        if (list.length === 0) {
          empty.classList.add("show");
          count.textContent = "0 matches";
          return;
        }
        empty.classList.remove("show");
        count.textContent =
          list.length + (list.length === 1 ? " match" : " matches");

        list.forEach((m, i) => {
          const [c1, c2] = colorPairs[i % colorPairs.length];
          const row = document.createElement("div");
          row.className = "match-row";
          row.innerHTML = `
        <div class="fixture">
          <span class="badge" style="background:${c1}">${initials(m.home)}</span>
          <span class="team-name">${m.home}</span>
          <span class="vs">vs</span>
          <span class="team-name">${m.away}</span>
          <span class="badge" style="background:${c2}">${initials(m.away)}</span>
        </div>
        <div class="date-cell">${m.date}</div>
        <div class="time-cell">${m.time}</div>
      `;
          container.appendChild(row);
        });
      }

      function runSearch() {
        const q = document
          .getElementById("searchInput")
          .value.trim()
          .toLowerCase();
        if (q === "") {
          renderMatches(matches);
          return;
        }
        const filtered = matches.filter(
          (m) =>
            m.home.toLowerCase().includes(q) ||
            m.away.toLowerCase().includes(q) ||
            (m.home + " vs " + m.away).toLowerCase().includes(q),
        );
        renderMatches(filtered);
      }

      document.getElementById("searchBtn").addEventListener("click", runSearch);
      document
        .getElementById("searchInput")
        .addEventListener("input", runSearch);
      document
        .getElementById("searchInput")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") runSearch();
        });

      renderMatches(matches);
    </script>
  </body>
</html>
